# GitLab CI pipeline: запуск тестов, генерация отчёта и публикация GitLab Pages
stages:
  - test
  - report
  - deploy

run-tests:
  stage: test
  image: ubuntu:24.04
  # Сохраняем существующее поведение: отчёт можно сформировать даже при падении тестов.
  allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y python3.12 python3.12-venv python3-pip
    - python3.12 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - playwright install --with-deps
  script:
    - pytest -m regression --alluredir=allure-results --numprocesses 2
  artifacts:
    paths:
      - allure-results/
    expire_in: 7 days
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

publish-report:
  stage: report
  image: ubuntu:24.04
  needs:
    - job: run-tests
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y openjdk-11-jre wget tar
    - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
    - tar -xvf allure-2.32.0.tgz
  script:
    - allure-2.32.0/bin/allure generate allure-results -o allure-report --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 7 days
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

pages:
  stage: deploy
  needs:
    - job: publish-report
      artifacts: true
  script:
    - mkdir -p public
    - cp -r allure-report/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
