name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Configure test settings
        env:
          APP_URL: ${{ vars.APP_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          : "${APP_URL:?Set the APP_URL repository variable}"
          : "${TEST_USER_EMAIL:?Set the TEST_USER_EMAIL repository secret}"
          : "${TEST_USER_USERNAME:?Set the TEST_USER_USERNAME repository secret}"
          : "${TEST_USER_PASSWORD:?Set the TEST_USER_PASSWORD repository secret}"
          {
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'HEADLESS=true\n'
            printf 'BROWSERS=["chromium","webkit"]\n'
            printf 'TEST_USER.EMAIL=%s\n' "$TEST_USER_EMAIL"
            printf 'TEST_USER.USERNAME=%s\n' "$TEST_USER_USERNAME"
            printf 'TEST_USER.PASSWORD=%s\n' "$TEST_USER_PASSWORD"
            printf 'TEST_DATA.IMAGE_PNG_FILE=testdata/files/image.png\n'
          } > .env

      - name: Run Playwright tests and generate Allure results
        run: pytest -m regression --alluredir=allure-results --numprocesses 2

      - name: Upload allure-results artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: error

  publish-report:
    needs: run-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download allure-results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report with history
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Verify Allure report output
        id: verify_allure_report
        if: always()
        run: test -d allure-history && test -n "$(find allure-history -mindepth 1 -print -quit)"

      - name: Deploy report to GitHub Pages
        if: >-
          always() &&
          steps.verify_allure_report.outcome == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
